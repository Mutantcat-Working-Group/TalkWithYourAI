name: Release

# Build desktop installers for all three platforms.
#
# Outputs per platform:
#   macOS   -> .dmg  (ad-hoc signed, universal: arm64 + x86_64)
#   Windows -> .exe  (NSIS installer)
#   Linux   -> .AppImage + .deb
#
# Ad-hoc signing: the identity "-" is Apple's ad-hoc marker. It is NOT notarized
# and NOT Developer-ID signed, so Gatekeeper still warns on first launch
# (right-click -> Open). It does give the bundle a self-consistent signature,
# which matters on Apple Silicon.
#
# Updater artifacts (createUpdaterArtifacts = true in tauri.conf.json) require
# the minisign private key. Until TAURI_SIGNING_PRIVATE_KEY is set as a repo
# secret, the build overrides createUpdaterArtifacts to false so it still
# succeeds; the signature files and latest.json are then simply absent.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.64). Leave empty to build artifacts only.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg carries both arm64 and x86_64, so macOS is a
          # single job that already covers two architectures.
          - platform: macos-latest
            platform_group: macos
            args: '--target universal-apple-darwin --bundles dmg'
            artifact_name: macos-dmg
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Windows ships both CPU architectures.
          - platform: windows-latest
            platform_group: windows
            args: '--bundles nsis'
            artifact_name: windows-x64
            rust_targets: 'x86_64-pc-windows-msvc'
          - platform: windows-latest
            platform_group: windows
            args: '--target aarch64-pc-windows-msvc --bundles nsis'
            artifact_name: windows-arm64
            rust_targets: 'aarch64-pc-windows-msvc'
          # Linux ships both CPU architectures.
          - platform: ubuntu-22.04
            platform_group: linux
            args: '--bundles deb'
            artifact_name: linux-x64
            rust_targets: 'x86_64-unknown-linux-gnu'
            bundle_dir: target/release/bundle
          - platform: ubuntu-22.04-arm
            platform_group: linux
            args: '--bundles deb'
            artifact_name: linux-arm64
            rust_targets: 'aarch64-unknown-linux-gnu'
            bundle_dir: target/release/bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri -> target
          # Keyed per target so a cached single-arch libopus.a can never be
          # reused by a different architecture, and a universal lipo never
          # reuses a single-arch build dir.
          key: release-${{ matrix.artifact_name }}

      - name: Install Linux dependencies
        if: matrix.platform_group == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libxdo-dev libssl-dev pkg-config

      - name: Build
        shell: bash
        env:
          # Ad-hoc signing for macOS only; harmless/ignored on the other platforms.
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform_group == 'macos' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          # Build the --config arguments as an array so `--config` and its JSON
          # value stay two separate argv entries. Storing them in a single quoted
          # string makes tauri see one malformed argument.
          updater_flag=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            updater_flag=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          elif [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is set but the password is empty - building without updater artifacts (a protected key would fail signing at the end of the build)."
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not configured - building without updater artifacts."
          fi
          npx tauri build ${{ matrix.args }} "${updater_flag[@]}"

      # AppImage needs linuxdeploy, which comes from
      # github.com/tauri-apps/binary-releases and intermittently returns 504.
      # Keep it off the critical path: .deb above is the guaranteed Linux
      # artifact, AppImage is best-effort retried here and never fails the run.
      # The flag is passed via $GITHUB_ENV rather than step outputs: a step that
      # writes $GITHUB_OUTPUT still needs an `outputs:` mapping to be readable
      # as steps.<id>.outputs.<name>, and forgetting that mapping silently
      # resolves to '' -- which would skip the AppImage build forever.
      - name: Prepare AppImage toolchain (best effort)
        if: matrix.platform_group == 'linux'
        continue-on-error: true
        id: appimage_prepare
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/talkwithyourai-packaging-tools
        run: |
          set -eu
          for attempt in 1 2 3; do
            echo "::group::prepare-linuxdeploy attempt $attempt"
            if ./.github/scripts/prepare-linuxdeploy-wrapper.sh "$(uname -m)"; then
              echo "::endgroup::"
              echo "APPIMAGE_PREPARED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::endgroup::"
            sleep $((attempt * 20))
          done
          echo "::warning::linuxdeploy download failed after 3 attempts; skipping AppImage, .deb is still produced."
          echo "APPIMAGE_PREPARED=false" >> "$GITHUB_ENV"
          exit 0

      - name: Build AppImage (best effort)
        if: matrix.platform_group == 'linux' && env.APPIMAGE_PREPARED == 'true'
        continue-on-error: true
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/talkwithyourai-packaging-tools
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          # A .deb-only build is not updater-enabled, and enabling updater
          # artifacts without an updater target makes tauri-bundler abort. So
          # this AppImage run always leaves them off.
          npx tauri build --bundles appimage \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' \
            || echo "::warning::AppImage bundling failed; .deb is still published."

      # Tauri deletes the .app after sealing the .dmg, so verify the copy the
      # user actually receives by mounting the dmg. Failing here means the
      # shipped bundle is not ad-hoc signed and the release is not shippable.
      - name: Verify macOS ad-hoc signature (from the dmg)
        if: matrix.platform_group == 'macos'
        shell: bash
        run: |
          set -eu
          dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)"
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg was produced"
            exit 1
          fi
          mountpoint="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mountpoint" -nobrowse -quiet
          trap 'hdiutil detach "$mountpoint" -quiet || true' EXIT
          app="$(find "$mountpoint" -maxdepth 1 -name '*.app' | head -n1)"
          if [ -z "$app" ]; then
            echo "::error::No .app inside $dmg"
            exit 1
          fi
          echo "Bundle: $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E 'Signature|Identifier|Format' || true
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Signature=adhoc' \
            || { echo "::error::Bundle is not ad-hoc signed"; exit 1; }

      - name: List produced installers
        shell: bash
        run: |
          echo "--- bundle tree ---"
          find src-tauri/target -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.sig' \
               -o -name 'latest.json' \) \
            -not -path '*/deps/*' | sort

      # One checksum file per installer, carrying both MD5 and SHA-1 as required.
      - name: Generate MD5 and SHA-1 checksums
        id: checksums
        shell: bash
        run: |
          set -eu
          # Read the version from package.json so a bump never leaves a stale
          # version inside the checksum files.
          version="$(node -p "require('./package.json').version")"
          echo "Checksumming version ${version}"
          outdir="$(mktemp -d)"
          echo "outdir=$outdir" >> "$GITHUB_OUTPUT"
          total=0
          while IFS= read -r file; do
            name="$(basename "$file")"
            md5="$(md5sum "$file" | awk '{print $1}')"
            sha1="$(sha1sum "$file" | awk '{print $1}')"
            size="$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")"
            dest="${outdir}/${name}.checksums.txt"
            {
              echo "# ${name}"
              echo "# version: ${version}"
              echo "# size: ${size} bytes"
              echo ""
              echo "MD5    = ${md5}"
              echo "SHA-1  = ${sha1}"
            } > "$dest"
            # Keep the flat GNU-tool format too, so `md5sum -c` works directly.
            echo "${md5}  ${name}" >> "${outdir}/MD5SUMS"
            echo "${sha1}  ${name}" >> "${outdir}/SHA1SUMS"
            total=$((total + 1))
            echo "checksummed ${name}"
          done < <(find src-tauri/target -type f \
                     \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
                        -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
                     -not -path '*/deps/*' \
                     -size +100k | sort)
          if [ "$total" -eq 0 ]; then
            echo "::error::No installers found to checksum"
            exit 1
          fi
          echo "Generated checksums for ${total} installers"

      # macOS/Windows always produce their bundle, so a miss there is a real
      # failure. Linux's AppImage is best-effort (see the steps above), so the
      # whole glob list tolerates "no files" only for that entry — hence the
      # split into two uploads rather than one strict glob.
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/macos/*.tar.gz
            ${{ steps.checksums.outputs.outdir }}/*

      - name: Upload AppImage (optional)
        if: matrix.platform_group == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}-appimage
          if-no-files-found: ignore
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            ${{ steps.checksums.outputs.outdir }}/*

      - name: Upload updater signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}-updater
          if-no-files-found: ignore
          retention-days: 14
          path: |
            src-tauri/target/**/*.sig
            src-tauri/target/**/latest.json

  publish:
    # Publish a GitHub Release when a v* tag was pushed, or a tag input was given.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: List release assets
        run: find dist -type f | sort

      # fail_on_unmatched_files is false so an optional AppImage absence does not
      # fail the run, but that also means a totally empty dist/ would publish a
      # green, empty release. Assert every architecture's installer is present,
      # and that each one shipped a checksum file.
      - name: Assert release assets exist
        run: |
          set -eu
          echo "--- assets ---"
          find dist -type f | sort
          count=$(find dist -type f | wc -l | tr -d ' ')
          echo "Found ${count} release assets"
          if [ "$count" -lt 6 ]; then
            echo "::error::Expected at least 6 release assets, found ${count}"
            exit 1
          fi
          # Per-architecture installers. Counted rather than name-matched so the
          # check does not depend on Tauri's arch suffix spelling (which differs
          # per bundler: deb uses amd64/arm64, nsis uses x64/arm64).
          expect_count() {
            local pattern="$1" want="$2" label="$3"
            local got
            got=$(find dist -name "$pattern" | wc -l | tr -d ' ')
            if [ "$got" -lt "$want" ]; then
              echo "::error::Expected at least ${want} ${label} (${pattern}), found ${got}"
              return 1
            fi
            echo "  ${label}: ${got} (>= ${want})"
          }
          expect_count '*.dmg'        1 "macOS dmg (universal = arm64+x86_64)"
          expect_count '*.exe'        2 "Windows exe (x64 + arm64)"
          expect_count '*.deb'        2 "Linux deb (amd64 + arm64)"
          # AppImage is best-effort by design (its linuxdeploy toolchain 504s
          # upstream), so warn instead of failing when it is absent.
          appimage_count=$(find dist -name '*.AppImage' -size +100k | wc -l | tr -d ' ')
          if [ "$appimage_count" -lt 2 ]; then
            echo "::warning::Only ${appimage_count} AppImage(s) produced; expected 2 (amd64 + arm64)."
          else
            echo "  Linux AppImage: ${appimage_count} (>= 2)"
          fi
          # Every installer must have a checksum file. Match by basename across
          # the whole tree: upload-artifact flattens each artifact to its least
          # common ancestor, so files land in per-artifact subdirectories.
          for f in $(find dist -type f \( -name '*.dmg' -o -name '*.exe' \
                      -o -name '*.deb' -o -name '*.AppImage' \)); do
            base="$(basename "$f")"
            cf="$(find dist -name "${base}.checksums.txt" | head -n1)"
            if [ -z "$cf" ]; then
              echo "::error::No checksum file for ${base}"
              exit 1
            fi
            grep -q '^MD5' "$cf" \
              || { echo "::error::${base}.checksums.txt has no MD5"; exit 1; }
            grep -q '^SHA-1' "$cf" \
              || { echo "::error::${base}.checksums.txt has no SHA-1"; exit 1; }
          done
          echo "All required installers and checksums present."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TalkWithYourAI ${{ steps.tag.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.tar.gz
            dist/**/*.sig
            dist/**/latest.json
            dist/**/*.checksums.txt
            dist/MD5SUMS
            dist/SHA1SUMS
